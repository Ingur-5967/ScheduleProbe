spring:
  application:
    name: ScheduleProbe
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dev}
    username: ${POSTGRES_USER:dev}
    password: ${POSTGRES_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    schemas: public
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}